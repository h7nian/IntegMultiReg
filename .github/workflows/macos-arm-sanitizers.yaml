name: macOS ARM sanitizer check

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  macos-arm-sanitizers:
    name: R-devel / macOS 26 arm64 / ASAN+UBSAN
    runs-on: macos-26
    timeout-minutes: 60
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: yes
      MallocNanoZone: 0
      UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
      ASAN_OPTIONS: detect_leaks=0:halt_on_error=1

    steps:
      - uses: actions/checkout@v6

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: devel
          use-public-rspm: true

      - name: Verify Oxford M1-SAN-like platform
        shell: bash
        run: |
          sw_vers
          uname -a
          xcrun clang --version
          test "$(uname -m)" = "arm64"

      - name: Install system dependencies
        run: brew install gsl

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::testthat
          needs: check

      - name: Configure Apple clang with ASAN and UBSAN
        shell: bash
        run: |
          makevars="${RUNNER_TEMP}/Makevars.sanitizer"
          {
            echo "CC = clang"
            echo "CFLAGS = -g -O1 -fsanitize=address,undefined -fno-sanitize-recover=undefined -fno-omit-frame-pointer"
            echo "LDFLAGS = -fsanitize=address,undefined"
          } > "${makevars}"
          echo "R_MAKEVARS_USER=${makevars}" >> "${GITHUB_ENV}"

          resource_dir="$(xcrun clang -print-resource-dir)"
          asan_runtime="${resource_dir}/lib/darwin/libclang_rt.asan_osx_dynamic.dylib"
          ubsan_runtime="${resource_dir}/lib/darwin/libclang_rt.ubsan_osx_dynamic.dylib"
          test -f "${asan_runtime}"
          test -f "${ubsan_runtime}"
          echo "SANITIZER_RUNTIME=${asan_runtime}:${ubsan_runtime}" >> "${GITHUB_ENV}"

      - name: Install instrumented package and tests
        shell: bash
        run: |
          mkdir -p "${RUNNER_TEMP}/sanitizer-library"
          export DYLD_INSERT_LIBRARIES="${SANITIZER_RUNTIME}"
          set +e
          R CMD INSTALL --preclean --install-tests \
            --library="${RUNNER_TEMP}/sanitizer-library" . \
            2>&1 | tee "${RUNNER_TEMP}/sanitizer-install.log"
          status=${PIPESTATUS[0]}
          set -e

          sanitizer_status=0
          if grep -Eq 'runtime error:|ERROR: AddressSanitizer|SUMMARY: (AddressSanitizer|UndefinedBehaviorSanitizer)|UndefinedBehaviorSanitizer:' \
            "${RUNNER_TEMP}/sanitizer-install.log"; then
            sanitizer_status=1
            grep -E 'runtime error:|ERROR: AddressSanitizer|SUMMARY: (AddressSanitizer|UndefinedBehaviorSanitizer)|UndefinedBehaviorSanitizer:' \
              "${RUNNER_TEMP}/sanitizer-install.log" | tail -n 25 | \
              while IFS= read -r line; do
                echo "::error title=Sanitizer install failure::${line}"
              done
          fi
          if [[ ${status} -ne 0 || ${sanitizer_status} -ne 0 ]]; then
            exit 1
          fi

      - name: Run the same installed testthat entry point as M1-SAN
        shell: bash
        run: |
          export DYLD_INSERT_LIBRARIES="${SANITIZER_RUNTIME}"
          set +e
          R_LIBS="${RUNNER_TEMP}/sanitizer-library" \
            Rscript -e 'library(testthat); library(IntegMultiReg); test_check("IntegMultiReg")' \
            2>&1 | tee "${RUNNER_TEMP}/sanitizer-tests.log"
          status=${PIPESTATUS[0]}
          set -e

          sanitizer_status=0
          if grep -Eq 'runtime error:|ERROR: AddressSanitizer|SUMMARY: (AddressSanitizer|UndefinedBehaviorSanitizer)|UndefinedBehaviorSanitizer:' \
            "${RUNNER_TEMP}/sanitizer-tests.log"; then
            sanitizer_status=1
            grep -E 'runtime error:|ERROR: AddressSanitizer|SUMMARY: (AddressSanitizer|UndefinedBehaviorSanitizer)|UndefinedBehaviorSanitizer:' \
              "${RUNNER_TEMP}/sanitizer-tests.log" | tail -n 25 | \
              while IFS= read -r line; do
                echo "::error title=Sanitizer test failure::${line}"
              done
          fi
          if [[ ${status} -ne 0 || ${sanitizer_status} -ne 0 ]]; then
            exit 1
          fi

      - name: Upload sanitizer logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: macos-26-arm64-sanitizer-logs
          path: ${{ runner.temp }}/sanitizer-*.log
          if-no-files-found: ignore
