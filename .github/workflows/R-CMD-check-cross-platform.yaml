name: R-CMD-check-cross-platform

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  R-CMD-check:
    name: ${{ matrix.config.os }} (R ${{ matrix.config.r }})
    runs-on: ${{ matrix.config.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        config:
          - {os: ubuntu-latest, r: release}
          - {os: ubuntu-latest, r: devel}
          - {os: windows-latest, r: release}
          - {os: macos-latest, r: release}
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: yes
      # Use R's portable LaTeX driver with TinyTeX, including makeindex.
      R_TEXI2DVICMD: emulation

    steps:
      - uses: actions/checkout@v6

      - uses: r-lib/actions/setup-pandoc@v2

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: ${{ matrix.config.r }}
          use-public-rspm: true

      - uses: r-lib/actions/setup-tinytex@v2

      # R-devel's Rd2pdf fallback uses Courier, whose metrics are not included
      # in the minimal TinyTeX installation (pcrr8t.tfm).
      - name: Install PDF manual font dependencies
        if: runner.os != 'Windows'
        run: |
          tlmgr install courier makeindex
          kpsewhich pcrr8t.tfm
          command -v pdflatex
          command -v makeindex

      - name: Install Linux system and CRAN check dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes autoconf automake devscripts libgsl-dev qpdf tidy

      - name: Install macOS system and CRAN check dependencies
        if: runner.os == 'macOS'
        run: |
          brew install autoconf automake checkbashisms gsl qpdf tidy-html5
          echo "$(brew --prefix tidy-html5)/bin" >> "$GITHUB_PATH"

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::rcmdcheck, any::V8
          needs: check

      # The PDF manual is checked on Linux and macOS. On Windows, focus on
      # compilation, installation, examples, tests, and vignettes; this also
      # matches the default arguments of r-lib/actions/check-r-package.
      - name: Check package on Windows
        if: runner.os == 'Windows'
        uses: r-lib/actions/check-r-package@v2
        with:
          args: c("--no-manual", "--as-cran")
          error-on: '"warning"'
          upload-results: true

      - name: Check package with PDF manual
        if: runner.os != 'Windows'
        uses: r-lib/actions/check-r-package@v2
        with:
          args: c("--as-cran")
          error-on: '"warning"'
          upload-results: true

      - name: Require zero test failures warnings and skips
        shell: bash
        run: |
          R CMD INSTALL --preclean --install-tests .
          Rscript .github/scripts/verify-tests.R

      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: tests-${{ matrix.config.os }}-${{ matrix.config.r }}
          path: ${{ runner.temp }}/test-evidence
          if-no-files-found: warn
