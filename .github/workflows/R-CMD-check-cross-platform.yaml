name: R-CMD-check-cross-platform

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  R-CMD-check:
    name: ${{ matrix.config.os }} (R ${{ matrix.config.r }})
    runs-on: ${{ matrix.config.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        config:
          - {os: ubuntu-latest, r: devel}
          - {os: windows-latest, r: release}
          - {os: macos-latest, r: release}
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: yes

    steps:
      - uses: actions/checkout@v6

      - uses: r-lib/actions/setup-pandoc@v2

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: ${{ matrix.config.r }}
          use-public-rspm: true

      - uses: r-lib/actions/setup-tinytex@v2

      - name: Install Linux system and CRAN check dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes autoconf automake devscripts libgsl-dev qpdf

      - name: Install macOS system and CRAN check dependencies
        if: runner.os == 'macOS'
        run: brew install autoconf automake checkbashisms gsl qpdf

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::rcmdcheck
          needs: check

      # The PDF manual is checked on Linux and macOS. On Windows, focus on
      # compilation, installation, examples, tests, and vignettes; this also
      # matches the default arguments of r-lib/actions/check-r-package.
      - name: Check package on Windows
        if: runner.os == 'Windows'
        uses: r-lib/actions/check-r-package@v2
        with:
          args: c("--no-manual", "--as-cran")
          error-on: '"warning"'

      - name: Check package with PDF manual
        if: runner.os != 'Windows'
        uses: r-lib/actions/check-r-package@v2
        with:
          args: c("--as-cran")
          error-on: '"warning"'
