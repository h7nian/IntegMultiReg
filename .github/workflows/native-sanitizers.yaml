name: Native sanitizer checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sanitizers:
    name: R-devel / ${{ matrix.compiler }} / ${{ matrix.label }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - compiler: gcc
            flags: undefined
            label: UBSAN
            preload_asan: false
          - compiler: clang
            flags: undefined
            label: UBSAN
            preload_asan: false
          - compiler: clang
            flags: address,undefined
            label: ASAN+UBSAN
            preload_asan: true

    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: yes
      UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
      ASAN_OPTIONS: detect_leaks=0:halt_on_error=1

    steps:
      - uses: actions/checkout@v6

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: devel
          use-public-rspm: true

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes clang gcc libgsl-dev

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::testthat
          needs: check

      - name: Configure ${{ matrix.compiler }} with ${{ matrix.label }}
        shell: bash
        run: |
          makevars="${RUNNER_TEMP}/Makevars.sanitizer"
          {
            echo "CC = ${{ matrix.compiler }}"
            echo "CFLAGS = -g -O1 -fsanitize=${{ matrix.flags }} -fno-sanitize-recover=undefined -fno-omit-frame-pointer"
            echo "LDFLAGS = -fsanitize=${{ matrix.flags }}"
          } > "${makevars}"
          echo "R_MAKEVARS_USER=${makevars}" >> "${GITHUB_ENV}"

          if [[ "${{ matrix.compiler }}" == "gcc" ]]; then
            sanitizer_runtime="$(gcc -print-file-name=libubsan.so)"
          elif [[ "${{ matrix.preload_asan }}" == "true" ]]; then
            asan_runtime="$(clang -print-file-name=libclang_rt.asan-x86_64.so)"
            ubsan_runtime="$(clang -print-file-name=libclang_rt.ubsan_standalone-x86_64.so)"
            test -f "${asan_runtime}"
            test -f "${ubsan_runtime}"
            sanitizer_runtime="${asan_runtime}:${ubsan_runtime}"
          else
            sanitizer_runtime="$(clang -print-file-name=libclang_rt.ubsan_standalone-x86_64.so)"
          fi
          test -f "${sanitizer_runtime%%:*}"
          echo "SANITIZER_RUNTIME=${sanitizer_runtime}" >> "${GITHUB_ENV}"

      - name: Install instrumented package and tests
        shell: bash
        run: |
          mkdir -p "${RUNNER_TEMP}/sanitizer-library"
          export LD_PRELOAD="${SANITIZER_RUNTIME}"
          set +e
          R CMD INSTALL --preclean --install-tests \
            --library="${RUNNER_TEMP}/sanitizer-library" . \
            2>&1 | tee "${RUNNER_TEMP}/sanitizer-install.log"
          status=${PIPESTATUS[0]}
          set -e
          if [[ ${status} -ne 0 ]]; then
            grep -E 'runtime error:|SUMMARY:|Sanitizer|Error|ERROR|failed|failure' \
              "${RUNNER_TEMP}/sanitizer-install.log" | tail -n 25 | \
              while IFS= read -r line; do
                echo "::error title=Sanitizer install failure::${line}"
              done
            exit "${status}"
          fi

      - name: Run complete test suite under ${{ matrix.label }}
        shell: bash
        run: |
          export LD_PRELOAD="${SANITIZER_RUNTIME}"
          set +e
          R_LIBS="${RUNNER_TEMP}/sanitizer-library" \
            Rscript -e 'library(testthat); library(IntegMultiReg); test_check("IntegMultiReg")' \
            2>&1 | tee "${RUNNER_TEMP}/sanitizer-tests.log"
          status=${PIPESTATUS[0]}
          set -e
          if [[ ${status} -ne 0 ]]; then
            grep -E 'runtime error:|SUMMARY:|Sanitizer|Error|ERROR|FAIL|Failure' \
              "${RUNNER_TEMP}/sanitizer-tests.log" | tail -n 25 | \
              while IFS= read -r line; do
                echo "::error title=Sanitizer test failure::${line}"
              done
            exit "${status}"
          fi
