name: R-CMD-check

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Match the parent and PSOCK workers before their numerical libraries load.
# Strict replay still compares every number; no tolerance is relaxed.
env:
  OMP_NUM_THREADS: '1'
  OPENBLAS_NUM_THREADS: '1'
  MKL_NUM_THREADS: '1'
  VECLIB_MAXIMUM_THREADS: '1'
  BLIS_NUM_THREADS: '1'

jobs:
  R-CMD-check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: yes

    steps:
      - uses: actions/checkout@v6

      - uses: r-lib/actions/setup-pandoc@v2

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - uses: r-lib/actions/setup-tinytex@v2

      - name: Install system and CRAN check dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes devscripts libgsl-dev qpdf tidy

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::rcmdcheck, any::V8, any::roxygen2
          needs: check

      - name: Verify generated documentation exports
        run: Rscript .github/scripts/verify-documentation.R

      - uses: r-lib/actions/check-r-package@v2
        with:
          args: c("--as-cran")
          error-on: '"warning"'

      - name: Install package for the complete covariate-selection example
        run: R CMD INSTALL .

      - name: Check joint posterior against independent integrals
        run: Rscript .github/scripts/verify-joint-reference.R

      - name: Reproduce paired and nested covariate comparison twice
        run: Rscript .github/scripts/verify-covariate-comparison.R

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: covariate-comparison-evidence
          path: |
            ${{ runner.temp }}/covariate-comparison-evidence
            ${{ runner.temp }}/joint-reference-evidence

  marginal-references:
    name: Independent reference / ${{ matrix.marginalize }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        marginalize: [variance, coefficients]
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      IMR_REFERENCE_MARGINALIZE: ${{ matrix.marginalize }}
    steps:
      - uses: actions/checkout@v6
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
      - name: Install GSL
        run: sudo apt-get update && sudo apt-get install --yes libgsl-dev
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          needs: check
      - run: R CMD INSTALL .
      - name: Check probabilities moments and credible quantiles
        run: Rscript .github/scripts/verify-joint-reference.R
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: marginal-reference-${{ matrix.marginalize }}
          path: ${{ runner.temp }}/joint-reference-evidence

  coverage:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v6
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
      - name: Install GSL
        run: sudo apt-get update && sudo apt-get install --yes libgsl-dev
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::covr
          needs: check
      - name: Measure tests and check every public entry point
        run: Rscript .github/scripts/coverage.R
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: test-coverage-and-api
          path: ${{ runner.temp }}/imr-coverage
