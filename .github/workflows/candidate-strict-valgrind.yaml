name: Candidate instrumented Valgrind check

# Test the pinned 0.2.0 candidate without replacing the historical release audit.
on:
  push:
    branches: ["ci/0.2.0-candidate-20260921"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  strict:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: yes
      R_TEXI2DVICMD: emulation
      _R_CHECK_ALWAYS_LOG_VIGNETTE_OUTPUT_: "true"
      # cli's optional progress timer otherwise retains TLS memory at exit.
      # Upstream switch: https://github.com/r-lib/cli/blob/main/src/thread.c
      CLI_NO_THREAD: "1"
      VALGRIND_OPTS: --tool=memcheck --leak-check=full --show-leak-kinds=definite,indirect,possible --errors-for-leak-kinds=definite,possible --num-callers=40 --track-origins=yes --error-exitcode=97
    steps:
      - uses: actions/checkout@v6
      - uses: r-lib/actions/setup-pandoc@v2
      - name: Install build and check dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes build-essential gfortran pkg-config libc6-dbg \
            libreadline-dev libpcre2-dev liblzma-dev libbz2-dev zlib1g-dev \
            libcurl4-openssl-dev libssl-dev libicu-dev libgsl-dev \
            libpng-dev libjpeg-dev libtiff-dev libcairo2-dev libpango1.0-dev \
            libnode-dev texinfo tidy qpdf devscripts
          mkdir -p "${RUNNER_TEMP}/strict-evidence" "${RUNNER_TEMP}/strict-library"
          echo "R_LIBS_USER=${RUNNER_TEMP}/strict-library" >> "${GITHUB_ENV}"
      - uses: actions/cache/restore@v4
        id: runtime-cache
        with:
          path: ${{ runner.temp }}/strict-runtime
          key: candidate-runtime-${{ runner.os }}-${{ hashFiles('.github/strict/build-candidate-runtime.sh') }}
      - name: Record graphics behavior of a restored non-Pango runtime
        if: steps.runtime-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          runtime="${RUNNER_TEMP}/strict-runtime"
          evidence="${RUNNER_TEMP}/strict-evidence"
          if test -x "${runtime}/bin/R"; then
            set +e
            "${runtime}/bin/R" -d "${runtime}/bin/valgrind ${VALGRIND_OPTS}" \
              --vanilla -f .github/strict/graphics-control.R > "${evidence}/graphics-before.log" 2>&1
            echo "$?" > "${evidence}/graphics-before-exit-status.txt"
            set -e
          fi
      - name: Build Valgrind 3.27.1 and instrumented R-devel
        if: steps.runtime-cache.outputs.cache-hit != 'true'
        shell: bash
        run: bash .github/strict/build-candidate-runtime.sh
      - name: Activate the audited runtime and retain provenance
        run: |
          echo "${RUNNER_TEMP}/strict-runtime/bin" >> "${GITHUB_PATH}"
          cp "${RUNNER_TEMP}/strict-runtime/provenance/"* "${RUNNER_TEMP}/strict-evidence/"
          echo "VALGRIND_OPTS=${VALGRIND_OPTS} --suppressions=${GITHUB_WORKSPACE}/.github/strict/upstream/pango.supp --suppressions=${GITHUB_WORKSPACE}/.github/strict/upstream/glib.supp --suppressions=${GITHUB_WORKSPACE}/.github/strict/upstream/ubuntu-font-baseline.supp" >> "${GITHUB_ENV}"
          cp .github/strict/upstream/* "${RUNNER_TEMP}/strict-evidence/"
      - uses: actions/cache/save@v4
        if: steps.runtime-cache.outputs.cache-hit != 'true'
        with:
          path: ${{ runner.temp }}/strict-runtime
          key: ${{ steps.runtime-cache.outputs.cache-primary-key }}
      - name: Validate base graphics with upstream system-library rules
        run: |
          R -d "valgrind ${VALGRIND_OPTS}" --vanilla -f .github/strict/graphics-control.R \
            > "${RUNNER_TEMP}/strict-evidence/graphics-after.log" 2>&1
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          pak-version: repo
          extra-packages: any::rcmdcheck, any::V8
          needs: check
      - uses: r-lib/actions/setup-tinytex@v2
      - name: Install manual font dependencies
        run: tlmgr install courier makeindex
      - name: Verify exact release artifact and record runtime
        run: |
          python3 .github/strict/verify-candidate-artifact.py
          R --version | tee "${RUNNER_TEMP}/strict-evidence/R-version.txt"
          valgrind --version | tee "${RUNNER_TEMP}/strict-evidence/valgrind-version.txt"
          Rscript -e 'writeLines(capture.output(sessionInfo()), file.path(Sys.getenv("RUNNER_TEMP"), "strict-evidence", "sessionInfo.txt"))'
      - name: Record package-free vignette graphics control
        shell: bash
        run: |
          set +e
          R -d "valgrind ${VALGRIND_OPTS}" --vanilla -f .github/strict/graphics-vignette-control.R \
            > "${RUNNER_TEMP}/strict-evidence/graphics-vignette-control.log" 2>&1
          echo "$?" > "${RUNNER_TEMP}/strict-evidence/graphics-vignette-control-status.txt"
          set -e
      - name: Record font-metric initialization controls
        shell: bash
        run: |
          cp .github/strict/graphics-vignette-control.R "${RUNNER_TEMP}/strict-evidence/graphics-vignette-control.R"
          for probe in 1 2 3; do
            set +e
            IMR_GRAPHICS_PROBE=width R -d "valgrind ${VALGRIND_OPTS}" --vanilla \
              -f .github/strict/graphics-vignette-control.R \
              > "${RUNNER_TEMP}/strict-evidence/graphics-vignette-control-width-${probe}.log" 2>&1
            status=$?
            set -e
            echo "${status}" > "${RUNNER_TEMP}/strict-evidence/graphics-vignette-control-width-${probe}-status.txt"
          done
      - name: Upload early graphics control
        uses: actions/upload-artifact@v6
        with:
          name: candidate-graphics-control
          path: ${{ runner.temp }}/strict-evidence/graphics-vignette-control*
      - name: Activate audited vignette graphics rules
        shell: bash
        run: |
          python3 - <<'PYCODE'
          import hashlib, json, pathlib
          base = pathlib.Path('.github/strict/upstream')
          meta = json.loads((base/'ubuntu-vignette-font-baseline.json').read_text())
          assert hashlib.sha256((base/'ubuntu-vignette-font-baseline.supp').read_bytes()).hexdigest() == meta['suppression_sha256']
          PYCODE
          echo "VALGRIND_OPTS=${VALGRIND_OPTS} --suppressions=${GITHUB_WORKSPACE}/.github/strict/upstream/ubuntu-vignette-font-baseline.supp" >> "${GITHUB_ENV}"
      - name: Require clean package-free vignette graphics with scoped rules
        shell: bash
        run: |
          failures=0
          for mode in default width; do
            for repeat in 1 2 3; do
              log="${RUNNER_TEMP}/strict-evidence/graphics-vignette-scoped-${mode}-${repeat}.log"
              set +e
              IMR_GRAPHICS_PROBE="${mode}" R -d "valgrind ${VALGRIND_OPTS}" --vanilla \
                -f .github/strict/graphics-vignette-control.R > "${log}" 2>&1
              status=$?
              set -e
              echo "${status}" > "${log%.log}-status.txt"
              if test "${status}" -ne 0 || ! grep -q 'ERROR SUMMARY: 0 errors' "${log}"; then
                failures=$((failures + 1))
              fi
            done
          done
          test "${failures}" -eq 0
      - name: Verify R heap detection and characterize the old release
        shell: bash
        run: bash .github/strict/negative-control.sh
      - name: Upload scoped-control validation
        uses: actions/upload-artifact@v6
        with:
          name: candidate-control-validation
          path: |
            ${{ runner.temp }}/strict-evidence/graphics-vignette*
            ${{ runner.temp }}/strict-evidence/negative-control-result.txt
            ${{ runner.temp }}/strict-evidence/old-tests.log
            ${{ runner.temp }}/strict-evidence/old-exit-status.txt
            ${{ runner.temp }}/strict-evidence/uninitialized-probe.log
            ${{ runner.temp }}/strict-evidence/probe-exit-status.txt
      - name: Check the exact candidate including examples tests and vignettes
        shell: bash
        run: bash .github/strict/check-candidate.sh
      - name: Check instrumented parent and PSOCK worker suite
        shell: bash
        run: |
          evidence="${RUNNER_TEMP}/strict-evidence"
          mkdir -p "${RUNNER_TEMP}/candidate-library" "${evidence}/workers"
          R CMD INSTALL --preclean --install-tests \
            --library="${RUNNER_TEMP}/candidate-library" \
            .github/strict/fixtures/IntegMultiReg_0.2.0.tar.gz \
            > "${evidence}/worker-install.log" 2>&1
          export IMR_VALGRIND_LOG_DIR="${evidence}/workers"
          chmod +x .github/scripts/valgrind-worker-rscript.sh
          R_LIBS="${RUNNER_TEMP}/candidate-library" \
            R -d "valgrind ${VALGRIND_OPTS}" --vanilla \
            -f .github/scripts/verify-valgrind-suite.R \
            > "${evidence}/worker-suite.log" 2>&1
          cp -R "${RUNNER_TEMP}/test-evidence" "${evidence}/test-evidence"
          python3 .github/strict/verify-candidate-workers.py "${evidence}/worker-suite.log"
      - name: Upload all audit evidence even on failure
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: candidate-instrumented-valgrind-evidence
          path: ${{ runner.temp }}/strict-evidence
          if-no-files-found: error
