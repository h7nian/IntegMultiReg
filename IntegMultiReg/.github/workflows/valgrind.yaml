name: Valgrind memory check

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  valgrind-workers:
    name: R-devel / Linux / valgrind PSOCK children
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: yes
      CLI_NO_THREAD: "1"
    steps:
      - uses: actions/checkout@v6
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: devel
          use-public-rspm: true
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes libgsl-dev valgrind
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          needs: check
      - name: Install package
        run: |
          mkdir -p "${RUNNER_TEMP}/worker-library"
          R CMD INSTALL --preclean --library="${RUNNER_TEMP}/worker-library" .
      - name: Check instrumented PSOCK children
        shell: bash
        run: |
          export IMR_VALGRIND_LOG_DIR="${RUNNER_TEMP}/valgrind-workers"
          mkdir -p "${IMR_VALGRIND_LOG_DIR}"
          chmod +x .github/scripts/valgrind-worker-rscript.sh
          R_LIBS="${RUNNER_TEMP}/worker-library" \
            Rscript .github/scripts/verify-valgrind-workers.R 2>&1 | \
            tee "${IMR_VALGRIND_LOG_DIR}/verification.log"
      - name: Upload worker logs
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: valgrind-worker-logs
          path: ${{ runner.temp }}/valgrind-workers
          if-no-files-found: error

  valgrind:
    name: R-devel / Linux / valgrind
    runs-on: ubuntu-latest
    # Full instrumentation also covers every PSOCK refit and its R startup.
    timeout-minutes: 120
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: yes
      # Disable cli's optional timer thread, not package computations or reports.
      CLI_NO_THREAD: "1"

    steps:
      - uses: actions/checkout@v6

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: devel
          use-public-rspm: true

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes libgsl-dev valgrind

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::testthat
          needs: check

      - name: Install package with its tests
        shell: bash
        run: |
          mkdir -p "${RUNNER_TEMP}/valgrind-library"
          R CMD INSTALL --preclean --install-tests \
            --library="${RUNNER_TEMP}/valgrind-library" .

      - name: Run the installed tests under valgrind
        shell: bash
        run: |
          tests_dir="${RUNNER_TEMP}/valgrind-library/IntegMultiReg/tests"
          export IMR_VALGRIND_LOG_DIR="${RUNNER_TEMP}/valgrind-suite-workers"
          mkdir -p "${IMR_VALGRIND_LOG_DIR}"
          chmod +x "${GITHUB_WORKSPACE}/.github/scripts/valgrind-worker-rscript.sh"
          cd "${tests_dir}"
          set +e
          R_LIBS="${RUNNER_TEMP}/valgrind-library" \
            R -d "valgrind --tool=memcheck --leak-check=full --show-leak-kinds=definite --errors-for-leak-kinds=definite --track-origins=yes --error-exitcode=1" \
              --vanilla -f "${GITHUB_WORKSPACE}/.github/scripts/verify-valgrind-suite.R" \
              2>&1 | tee "${RUNNER_TEMP}/valgrind-tests.log"
          status=${PIPESTATUS[0]}
          set -e
          if [[ ${status} -ne 0 ]]; then
            grep -E 'Invalid |uninitialised|definitely lost|ERROR SUMMARY' \
              "${RUNNER_TEMP}/valgrind-tests.log" | tail -n 40 | \
              while IFS= read -r line; do
                echo "::error title=Valgrind failure::${line}"
              done
            exit "${status}"
          fi

      - name: Upload valgrind log
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: valgrind-test-log
          path: |
            ${{ runner.temp }}/valgrind-tests.log
            ${{ runner.temp }}/test-evidence
            ${{ runner.temp }}/valgrind-suite-workers
          if-no-files-found: error
