url: https://h7nian.github.io/IntegMultiReg/

template:
  bootstrap: 5
  math-rendering: katex

development:
  mode: unreleased
  version_label: info

home:
  title: Bayesian regression for multi-platform biomarkers in R
  description: >
    Fit Bayesian regression models to partially overlapping molecular platforms,
    inspect posterior uncertainty, and evaluate predictions with cross-validation.
  links:
  - text: Read the methodology paper
    href: https://academic.oup.com/biometrics/article/73/2/615/7537638
  - text: Paper PDF (publisher)
    href: https://academic.oup.com/biometrics/article-pdf/73/2/615/55973435/biometrics_73_2_615.pdf
  - text: Methods and reproducibility
    href: method-coverage.html
  - text: Migrating to version 0.2.0
    href: migration.html

navbar:
  structure:
    left: [intro, reference, guides, news]
    right: [search, github]
  components:
    intro:
      text: Get started
      href: articles/IntegMultiReg.html
    guides:
      text: Guides
      menu:
      - text: Compare covariate formulas
        href: articles/covariate-comparison.html
      - text: Methods and reproducibility
        href: method-coverage.html
      - text: Migrating to version 0.2.0
        href: migration.html

reference:
- title: Prepare data and fit models
  desc: Validate subject identifiers, align platforms, and fit the model.
  contents:
  - imr_data
  - validate_imr_data
  - as.data.frame.imr_data
  - imr
- title: Inspect and compare fits
  contents:
  - print.imr
  - summary.imr
  - coef.imr
  - validate_imr
  - compare_imr
  - upgrade_imr_fit
- title: Predict and cross-validate
  contents:
  - predict.imr
  - cv_imr
  - print.imr_cv
- title: Selection and interaction uncertainty
  desc: Summarize retained draws from the fitted selection sampler.
  contents:
  - posterior_summary
  - confint.imr
- title: Coefficient and predictive uncertainty
  desc: Run conditional sampling, then summarize the resulting posterior draws or predict.
  contents:
  - posterior_draws
  - imr_posterior_methods
  - predict.imr_posterior
- title: Plot results
  contents:
  - plot.imr
  - plot_top_features
  - plot_subgroup_sizes
- title: Example data
  contents:
  - simIMR
  - kircIMR
- title: Package information
  contents:
  - IntegMultiReg-package
