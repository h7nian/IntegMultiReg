url: https://h7nian.github.io/IntegMultiReg/

template:
  bootstrap: 5
  math-rendering: katex

development:
  mode: unreleased
  version_label: info

home:
  title: Bayesian regression for multi-platform biomarkers in R
  description: >
    Fit Bayesian regression models to partially overlapping molecular platforms,
    inspect posterior uncertainty, and evaluate predictions with cross-validation.
  links:
  - text: Read the methodology paper
    href: https://academic.oup.com/biometrics/article/73/2/615/7537638
  - text: Paper PDF (publisher)
    href: https://academic.oup.com/biometrics/article-pdf/73/2/615/55973435/biometrics_73_2_615.pdf
  - text: Methods and reproducibility
    href: method-coverage.html
  - text: Migrating to version 0.3.0
    href: migration.html

navbar:
  structure:
    left: [intro, reference, guides, news]
    right: [search, github]
  components:
    intro:
      text: Get started
      href: articles/IntegMultiReg.html
    guides:
      text: Guides
      menu:
      - text: Choose a sampling algorithm
        href: articles/marginalization.html
      - text: Joint posterior computation
        href: articles/joint-posterior.html
      - text: Compare covariate formulas
        href: articles/covariate-comparison.html
      - text: Record and replay an analysis
        href: articles/reproducibility.html
      - text: Methods and reproducibility
        href: method-coverage.html
      - text: Migrating to version 0.3.0
        href: migration.html

reference:
- title: Prepare data and fit models
  contents:
  - imr_data
  - validate_imr_data
  - as.data.frame.imr_data
  - imr
  - imr_priors
  - imr_mcmc
  - imr_control
- title: Inspect posterior samples
  desc: Extract and summarize the samples stored by the fitted model.
  contents:
  - print.imr
  - summary.imr
  - coef.imr
  - confint.imr
  - inclusion_probabilities
  - posterior_draws
  - mcmc_diagnostics
- title: Conditional regression for a Laplace selection fit
  desc: Sample and summarize regression parameters using the stored selection weights.
  contents:
  - sample_regression_posterior
  - imr_posterior_methods
  - predict.imr_posterior
- title: Check and compare objects
  contents:
  - validate_imr_object
  - compare_fit_summaries
- title: Predict and cross-validate
  contents:
  - predict.imr
  - predict.imr_selection
  - cv_imr
  - print.imr_cv
  - print.imr_predictions
- title: Plot results
  contents:
  - plot.imr
  - plot_top_features
  - plot_subgroup_sizes
- title: Example data
  contents:
  - simIMR
  - kircIMR
- title: Package information
  contents:
